[build]
  command = "npm run build"
  publish = ".next"

# Wird zur Build-Zeit in Next.js eingebrannt. Ohne diesen Wert erzeugt die
# Registrierung Bestätigungslinks auf http://localhost:3000.
# SECRETS_SCAN_OMIT_KEYS: Schließt SMTP_USER (und SMTP_FROM) vom Secret-Scanning aus,
# da der Wert (die E-Mail info@sitov-academy.com) auch die öffentliche Impressums- und Kontakt-E-Mail ist.
[build.environment]
  NEXT_PUBLIC_SITE_URL = "https://www.sitov-academy.com"
  SECRETS_SCAN_OMIT_KEYS = "SMTP_USER,SMTP_FROM"

[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://www.sitov-academy.com"
  SECRETS_SCAN_OMIT_KEYS = "SMTP_USER,SMTP_FROM"

[[plugins]]
  package = "@netlify/plugin-nextjs"
